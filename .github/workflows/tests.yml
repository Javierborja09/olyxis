name: Olyxis Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: pdo, pdo_mysql, mbstring, curl
        coverage: none
    
    - name: Check if composer.json exists
      run: |
        if [ ! -f composer.json ]; then
          echo "composer.json no encontrado, creando uno básico..."
          echo '{"name": "javierborja09/olyxis", "description": "Framework PHP modular", "require": {"php": ">=8.0"}}' > composer.json
        fi
    
    - name: Validate composer.json
      run: composer validate --no-check-all --no-check-publish
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction || echo "No hay dependencias para instalar"
    
    - name: Check PHP Syntax
      run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
    
    - name: Run tests
      run: |
        if [ -f vendor/bin/phpunit ]; then
          vendor/bin/phpunit
        else
          echo "PHPUnit no está instalado, saltando tests..."
        fi